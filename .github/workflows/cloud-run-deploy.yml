name: 'United89-app-cloud-run-deploy'

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GEMINI_API_GCLOUD_PROJECT_ID }}
  REGION: ${{ vars.GCLOUD_REGION || 'asia-south2' }}

jobs:
  # =========================================================================
  # BACKEND DEPLOYMENT (Runs in parallel with Frontend)
  # =========================================================================
  deploy-backend:
    name: 'Deploy Backend'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      # If on main/master -> prod backend & prod firestore DB; otherwise -> dev
      BACKEND_SERVICE: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && (vars.UNITED89_CLUB_APP_BACKEND_SERVICE || 'united89-quiz-backend') || (vars.UNITED89_DEV_BACKEND_SERVICE || 'united89-quiz-backend-dev') }}
      DB_NAME: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'first-firestore-db' || (vars.UNITED89_DEV_DB_NAME || 'dev-firestore-db') }}

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GEMINI_API_PROJECT_CLIENT_JSON }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Build and Deploy Backend'
        run: |
          echo "Environment target: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'Production' || 'Development' }}"
          echo "Deploying Backend service: ${{ env.BACKEND_SERVICE }}"
          echo "Using Firestore Database: ${{ env.DB_NAME }}"

          # Build Backend Image
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} quiz-app/backend --project ${{ env.PROJECT_ID }}
          
          # Deploy Backend to Cloud Run
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars DB_NAME=${{ env.DB_NAME }} \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --set-env-vars GOOGLE_GENAI_USE_VERTEXAI=${{ vars.GOOGLE_GENAI_USE_VERTEXAI }} \
            --set-env-vars GOOGLE_CLOUD_PROJECT=${{ vars.GEMINI_API_GCLOUD_PROJECT_ID }} \
            --set-env-vars GOOGLE_CLOUD_LOCATION=${{ vars.GOOGLE_CLOUD_LOCATION }} \
            --project ${{ env.PROJECT_ID }}

      - name: 'Backend Deployment Summary'
        run: |
          echo "Backend Deployment Complete!"
          echo "Backend URL: $(gcloud run services describe ${{ env.BACKEND_SERVICE }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' --project ${{ env.PROJECT_ID }})"

  # =========================================================================
  # FRONTEND DEPLOYMENT (Runs in parallel with Backend)
  # =========================================================================
  deploy-frontend:
    name: 'Deploy Frontend'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      # If on main/master -> prod frontend & backend; otherwise -> dev
      FRONTEND_SERVICE: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && (vars.UNITED89_CLUB_APP_FRONTEND_SERVICE || 'united89-quiz-frontend') || (vars.UNITED89_DEV_FRONTEND_SERVICE || 'united89-quiz-frontend-dev') }}
      BACKEND_SERVICE: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && (vars.UNITED89_CLUB_APP_BACKEND_SERVICE || 'united89-quiz-backend') || (vars.UNITED89_DEV_BACKEND_SERVICE || 'united89-quiz-backend-dev') }}

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GEMINI_API_PROJECT_CLIENT_JSON }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Determine Backend URL'
        id: backend_url
        run: |
          # Query existing backend Cloud Run service URL
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' --project ${{ env.PROJECT_ID }} 2>/dev/null || true)
          
          # Fallback if service doesn't exist yet (first-time deployment)
          if [ -z "$URL" ]; then
            echo "Backend service not yet created. Generating deterministic Cloud Run URL..."
            PROJECT_NUM=$(gcloud projects describe ${{ env.PROJECT_ID }} --format 'value(projectNumber)')
            URL="https://${{ env.BACKEND_SERVICE }}-${PROJECT_NUM}.${{ env.REGION }}.run.app"
          fi
          
          echo "Resolved Backend URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: 'Build and Deploy Frontend'
        run: |
          BACKEND_URL="${{ steps.backend_url.outputs.url }}"
          echo "Environment target: ${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'Production' || 'Development' }}"
          echo "Deploying Frontend service: ${{ env.FRONTEND_SERVICE }}"
          echo "Connecting Frontend to Backend at: ${BACKEND_URL}"
          
          # Create a temporary cloudbuild.yaml to pass VITE_API_URL build arg
          cat > quiz-app/frontend/cloudbuild_gh_actions.yaml <<EOF
          steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '--build-arg', "VITE_API_URL=${BACKEND_URL}", '-t', "gcr.io/${{ env.PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}", '.']
          images:
          - "gcr.io/${{ env.PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}"
          EOF
          
          # Build and Push Frontend Image
          gcloud builds submit quiz-app/frontend \
            --config quiz-app/frontend/cloudbuild_gh_actions.yaml \
            --project ${{ env.PROJECT_ID }}
          
          # Deploy Frontend to Cloud Run
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 80 \
            --project ${{ env.PROJECT_ID }}

      - name: 'Cleanup'
        if: always()
        run: rm -f quiz-app/frontend/cloudbuild_gh_actions.yaml

      - name: 'Frontend Deployment Summary'
        run: |
          echo "Frontend Deployment Complete!"
          echo "Frontend URL: $(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)' --project ${{ env.PROJECT_ID }})"
